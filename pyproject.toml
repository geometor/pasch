[project]
name = "geometor-pasch"
dynamic = ["version"]
authors = [
  { name = "phiarchitect", email = "github@geometor.com" },
]
description = "the German geometer whose 1882 Vorlesungen established the axioms of linear order, planar separation, and modern hypothetico-deductive rigor"
readme = "README.rst"
requires-python = ">=3.13"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sympy>=1.13",
    "geometor-model",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
pasch = "geometor.pasch.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geometor*"]
namespaces = true

[tool.setuptools.dynamic]
version = { attr = "geometor.pasch.__version__" }

[project.urls]
"Website" = "https://geometor.github.io/pasch"
"Repository" = "https://github.com/geometor/pasch"
"Issues" = "https://github.com/geometor/pasch/issues"

[tool.pytest.ini_options]
pythonpath = ["src", "../model/src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "demos"]

[tool.ruff.lint]
select = ["E", "F", "I", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
